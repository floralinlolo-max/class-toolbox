<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班級百寶箱後台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="../css/app.css">
<style>
body.adm { display: block; overflow: auto; min-height: 100%; }
.adm-top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.adm-top h1 { font-family: var(--title); font-size: 22px; margin: 0; }
.adm-top .who { font-size: 14px; color: var(--muted); word-break: break-all; }
.adm-main { max-width: 1080px; margin: 0 auto; padding: 16px; }
.adm-note { background: #e8f4ef; border-left: 5px solid var(--pri); padding: 10px 14px; border-radius: 10px; margin: 0 0 14px; }
.adm-note ul { margin: 4px 0 0; padding-left: 1.3em; }
.adm-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
.adm-card h2 { font-family: var(--title); font-size: 19px; margin: 0 0 8px; }
.adm-add { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 260px); gap: 12px; align-items: start; }
.adm-add textarea { min-height: 110px; }
.mem-tbl td { white-space: normal; }
.mem-tbl td.e { text-align: left; word-break: break-all; }
.mem-tbl .inp { padding: 4px 8px; }
.role { display: inline-block; border-radius: 20px; padding: 1px 10px; font-size: 14px; font-weight: 700; background: #fff1c9; color: #6b4a00; }
.role.admin { background: #e3f4e8; color: #1d6b55; }
.pg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.pg { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.pg.off .pg-prev { filter: grayscale(.8) brightness(.95); }
.pg-prev { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; border: 1px solid rgba(0, 0, 0, .12); }
.pg-prev i { position: absolute; background: rgba(255, 255, 255, .88); border: 1px solid rgba(0, 0, 0, .18); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 14px; overflow: hidden; }
.pg-no { position: absolute; left: 6px; top: 4px; z-index: 1; background: rgba(0, 0, 0, .55); color: #fff; border-radius: 8px; padding: 0 8px; font-size: 13px; }
.pg-tools { display: flex; gap: 4px; flex-wrap: wrap; }
.pg-tools .btn { padding: 3px 9px; font-size: 14px; }
.pg .tog { margin: 0; }
a.btn { text-decoration: none; display: inline-block; }
.urlbox { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.urlbox code { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; word-break: break-all; }
.steps li { margin: 4px 0; }
@media (max-width: 640px) { .adm-add { grid-template-columns: 1fr; } .adm-main { padding: 10px; } }
</style>
</head>
<body class="adm">
<div id="app"></div>
<div id="layer"></div>
<div id="toasts"></div>
<script src="../js/core.js"></script>
<script src="../js/cloudcfg.js"></script>
<script src="../js/fb.js"></script>
<script src="admin.js"></script>
</body>
</html>
