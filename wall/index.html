<script>
'use strict';
/* 雲端動態牆：班級百寶箱的動態牆放到 claude.ai，登入同一個帳號，在哪台電腦打開都一樣。
   這個檔案接在 core.js、tools2.js（節錄）、wall.js 後面，把「資料存在哪裡」換成雲端。 */

/* ---------- 資料：只留動態牆用得到的 ---------- */
function defaultData() {
  return {
    app: '雲端動態牆', v: 1,
    info: { className: '我們班', sound: true, attPos: 'right' },
    students: [],
    att: {},
    sched: { periods: defaultPeriods(), week: { 1: [], 2: [], 3: [], 4: [], 5: [] }, saved: null },
    board: {
      mode: 'contact', vertical: false, scale: { contact: 0, free: 0 },
      contact: { items: [{ cat: 'hw', text: '' }] }, free: '', saved: [],
      duty: { on: false, mode: 'seq', count: 2, anchorDate: dateKey(), anchorIdx: 0, fixed: [] },
      countdown: { on: false, name: '段考', date: '' }
    },
    timerTitles: ['安靜閱讀', '小組討論', '寫學習單', '收拾整理'],
    clockNotes: ['寫完檢查姓名、座號，再檢查答案', '安靜作答，有問題請舉手', '交卷後安靜閱讀'],
    wall: { cur: null, pages: [], locked: false },
    imgs: {},      // 圖片編號 → 雲端圖檔 id
    src: null      // 上次從班級百寶箱匯入的時間
  };
}
function loadData() { D = defaultData(); }
function rollDay() { }
function refresh() { if (Wall.root) Wall.draw(); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));

// 存到雲端時只留今天的點名
function serialize() {
  const o = clone(D), t = dateKey();
  o.att = o.att && o.att[t] ? { [t]: o.att[t] } : {};
  return o;
}
function readLocal(k) { try { const o = JSON.parse(localStorage.getItem(k) || 'null'); return o && o.wall ? o : null; } catch (e) { return null; } }
function writeLocal(k, o) { try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) { } }
function useData(o) { D = fillDefaults(o, defaultData()); ensurePage(); }

// 動態牆至少要有一頁（第一次打開先放考試牆當範例）
function ensurePage() {
  if (D.wall.pages.length) return;
  const t = WALL_TPL.exam;
  const p = { id: uid(), name: t.name, bg: { type: 'preset', v: t.bg }, widgets: t.widgets.map((w, i) => ({ id: uid(), type: w.type, x: w.x, y: w.y, w: w.w, h: w.h, z: i + 1, cfg: Object.assign(WT[w.type].cfg(), clone(w.cfg || {})) })) };
  D.wall.pages.push(p); D.wall.cur = p.id;
}

/* ---------- 雲端同步 ---------- */
const STATE_T = { start: '☁ 連線中…', loading: '☁ 讀取中…', ok: '☁ 已同步', saving: '☁ 儲存中…', offline: '⚠ 連不上雲端', error: '⚠ 沒有存到雲端', local: '💻 只存在這台電腦' };
const Cloud = {
  mode: 'start', state: 'start', ref: null, assetsP: null, downloadsP: null,
  loaded: false, offline: false, localEdits: false, dirty: false, lastBody: '', pending: null,
  tab: uid(), n: 0, timer: null, writing: false, again: false, retried: false, slow: null,
  key() { return this.mode === 'cloud' ? 'cwall-cache:' + this.uid : 'cwall-local'; },
  label() { return STATE_T[this.state] || ''; },
  setState(s) {
    this.state = s;
    const el = document.getElementById('syncChip');
    if (el) { el.textContent = this.label(); el.className = 'wbtn sync ' + s; }
  },
  async init() {
    // claude.ai 的執行環境可能晚幾秒才準備好；直接打開檔案時沒有
    const framed = window.self !== window.top || /claude/.test(location.hostname);
    for (let i = 0; i < (framed ? 150 : 10) && !window.claude?.use; i++) await sleep(100);
    let db = null, user = null, id = null;
    if (window.claude?.use) {
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (db && user) id = await user.id();
      this.downloadsP = window.claude.use('downloads');
    }
    if (!db || !id) return this.goLocal();
    this.mode = 'cloud'; this.uid = id;
    this.assetsP = window.claude.use('assets');
    const cached = readLocal(this.key());   // 這個帳號在這台電腦上次的樣子，先顯示
    if (cached) { useData(cached); Wall.draw(); }
    this.setState('loading');
    this.ref = db.doc('data/users/' + id + '/wall');
    this.slow = setTimeout(() => {
      if (this.loaded) return;
      this.offline = true; this.setState('offline'); Veil.hide();
      toast('暫時連不上雲端，先顯示這台電腦上次的資料；連上後會自動同步。', { ms: 8000 });
    }, 10000);
    this.ref.onSnapshot(s => this.onSnap(s), e => this.onErr(e));
  },
  goLocal() {
    this.mode = 'local';
    const o = readLocal(this.key());
    if (o) { useData(o); Wall.draw(); }
    Veil.hide(); this.setState('local');
    if (!o) Welcome.show();
  },
  onSnap(s) {
    if (!this.loaded && s.metadata.fromCache) { if (s.exists) this.take(s.data()); return; }
    const first = !this.loaded;
    if (first) { this.loaded = true; clearTimeout(this.slow); Veil.hide(); }
    if (first && this.offline && this.localEdits) { this.offline = false; saveNow(); return; }   // 斷線時在這台改過，用這台的
    this.offline = false;
    if (!s.exists) {
      if (first) { this.setState('ok'); if (!readLocal(this.key())) Welcome.show(); }
      return;
    }
    if (!s.metadata.hasPendingWrites) this.take(s.data());
    if (!this.timer && !this.writing) this.setState('ok');
  },
  onErr(e) {
    clearTimeout(this.slow); Veil.hide();
    this.loaded = true; this.offline = true; this.setState('offline');
    if (e && e.code !== 'revoked') toast('雲端同步中斷了，重新整理網頁再試一次。', { ms: 8000 });
  },
  // 收到雲端的資料（別台電腦改的）
  take(data) {
    const w = data._w || {};
    if (w.tab === this.tab) return;              // 自己寫的
    if (this.timer || this.writing) return;      // 這台還有沒存完的修改，以這台為準
    const body = Object.assign({}, data); delete body._w;
    const json = JSON.stringify(body);
    if (json === this.lastBody) return;
    this.lastBody = json; this.pending = json;
    this.tryApply();
  },
  // 正在拖曳、打字或開著視窗時先不換，免得改到一半被蓋掉
  tryApply() {
    if (!this.pending) return;
    const a = document.activeElement;
    if (Layers.length || document.querySelector('.wd.dragging') || (a && a.closest && a.closest('.w-panel input, .w-panel textarea, [contenteditable="true"]'))) return;
    const o = JSON.parse(this.pending); this.pending = null;
    useData(o); writeLocal(this.key(), serialize());
    if (Wall.root) Wall.draw(); else Wall.open();
  },
  async push(json) {
    if (this.writing) { this.again = true; return; }
    if (json.length > 240000) { this.setState('error'); toast('資料太多，存不進雲端：請刪掉一些頁面或小工具。'); return; }
    this.writing = true; this.setState('saving');
    try {
      this.n++;
      await this.ref.set(Object.assign(JSON.parse(json), { _w: { tab: this.tab, n: this.n, at: Date.now() } }));
      this.lastBody = json; this.retried = false;
      this.setState('ok');
    } catch (e) {
      if (e && e.code === 'unavailable' && !this.retried) { this.retried = true; setTimeout(() => { this.dirty = true; saveNow(); }, 1500 + Math.random() * 1500); }
      else {
        this.setState('error');
        toast(e && e.code === 'quota_exceeded' ? '雲端空間滿了，沒有存到：請刪掉一些頁面或圖片。' : '沒有存到雲端，請檢查網路，或重新整理網頁。', { ms: 8000 });
      }
    } finally {
      this.writing = false;
      if (this.again) { this.again = false; this.dirty = true; saveNow(); }
    }
  }
};
Tick.add(() => Cloud.tryApply());

// 取代 core.js 的 save()：停一下再存，打字時不會每個字都寫一次
function save() {
  Cloud.dirty = true;
  clearTimeout(Cloud.timer);
  Cloud.timer = setTimeout(saveNow, 700);
  if (Cloud.mode === 'cloud' && Cloud.loaded) Cloud.setState('saving');
}
// 只有真的改過才存（關網頁時 core.js 也會呼叫這裡）
function saveNow() {
  clearTimeout(Cloud.timer); Cloud.timer = null;
  if (!D || Cloud.mode === 'start' || !Cloud.dirty) return;
  const body = serialize(), json = JSON.stringify(body);
  writeLocal(Cloud.key(), body);
  if (Cloud.mode === 'local') { Cloud.dirty = false; return; }
  if (!Cloud.loaded) { if (Cloud.offline) Cloud.localEdits = true; return; }
  Cloud.dirty = false;
  if (json === Cloud.lastBody) { if (!Cloud.writing) Cloud.setState('ok'); return; }
  Cloud.push(json);
}

/* ---------- 圖片：存到 claude.ai 的雲端圖檔（沒登入時存在這台電腦） ---------- */
function dataURLBlob(u) {
  const [head, b64] = u.split(','), type = (head.match(/data:([^;]+)/) || [])[1] || 'image/png';
  const bin = atob(b64), a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type });
}
function blobDataURL(b) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(b); }); }
const LocalImg = { put: ImgDB.put.bind(ImgDB), get: ImgDB.get.bind(ImgDB) };
ImgDB.put = async (id, url) => {
  const A = Cloud.mode === 'cloud' ? await Cloud.assetsP : null;
  if (A) {
    const r = await A.upload(dataURLBlob(url));
    D.imgs[id] = r.id; save(); return;
  }
  if (Cloud.mode === 'cloud') toast('這張圖片只存在這台電腦，別台電腦看不到。');
  return LocalImg.put(id, url);
};
ImgDB.get = async id => {
  const a = D.imgs && D.imgs[id];
  if (a) return '/_blob/' + a;
  return LocalImg.get(id);
};

// 存檔：claude.ai 裡要經過 downloads（會先問要不要存）
async function download(name, data, type = 'text/plain') {
  const dl = Cloud.downloadsP ? await Cloud.downloadsP : null;
  if (dl) {
    try { await dl.save({ filename: name, data }); toast('已存好：' + name); }
    catch (e) { if (!e || e.code !== 'declined') toast('沒辦法存檔：這個畫面不能下載檔案。'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: type + ';charset=utf-8' });
  const url = URL.createObjectURL(blob), a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

/* ---------- 和班級百寶箱互通：匯入備份檔、匯出動態牆 ---------- */
function wallImgRefs(wall) {
  const refs = new Set();
  for (const p of (wall && wall.pages) || []) {
    if (p.bg && p.bg.type === 'image' && p.bg.v) refs.add(p.bg.v);
    for (const w of p.widgets || []) if (w.type === 'image' && w.cfg && w.cfg.img) refs.add(w.cfg.img);
  }
  return [...refs];
}
const Sync = {
  async importFile() {
    const f = await pickFile('.json,application/json');
    if (!f) return;
    let o = null;
    try { o = JSON.parse(await f.text()); } catch (e) { }
    if (!o || (o.app !== '班級百寶箱' && o.app !== '雲端動態牆')) {
      return toast(o && Array.isArray(o.students) ? '這是班班的備份檔：請先匯入班級百寶箱，再從班級百寶箱匯出備份檔。' : '讀不懂這個檔案：請選班級百寶箱匯出的 .json 備份檔。', { ms: 8000 });
    }
    const pages = (o.wall && o.wall.pages) || [], kids = Array.isArray(o.students) ? o.students : [];
    const today = o.att && o.att[dateKey()];
    const opt = { wall: pages.length > 0, cls: kids.length > 0 || !!o.sched, att: !!today };
    modal('匯入' + (o.app === '雲端動態牆' ? '動態牆檔案' : '班級百寶箱的設定'), c => {
      const tog = (k, t, sub) => h('label', { class: 'tog imp' }, h('input', { type: 'checkbox', id: 'imp-' + k, checked: opt[k], disabled: sub === null, onchange: e => { opt[k] = e.target.checked; } }), h('span', null, h('b', null, t), sub ? h('small', null, sub) : null));
      c.body.append(h('p', null, '這個檔案裡有：' + (o.info && o.info.className ? '「' + o.info.className + '」，' : '') + '動態牆 ' + pages.length + ' 頁、同學 ' + kids.length + ' 位。要帶進來哪些？'),
        tog('wall', '動態牆（' + pages.length + ' 頁）', pages.length ? '會取代目前的動態牆，圖片也會一起帶進來' : null),
        o.app === '班級百寶箱' ? tog('cls', '名單、作息與課表、聯絡簿、常用標題', kids.length + ' 位同學（只帶座號和名字，分數不會帶）') : null,
        today ? tog('att', '今天的點名', '病假、事假的同學不算實到') : null,
        h('p', { class: 'muted small' }, '目前動態牆上改過的地方會被檔案的內容換掉。'));
      c.foot.append(h('button', { class: 'btn', onclick: () => c.close() }, '取消'),
        h('button', { class: 'btn pri', onclick: () => { c.close(); this.apply(o, opt); } }, '匯入'));
    });
  },
  async apply(o, opt) {
    let bad = 0, up = 0;
    if (opt.wall && o.wall) {
      const imgs = o.images || {}, todo = wallImgRefs(o.wall).filter(k => imgs[k] && !(D.imgs && D.imgs[k]));
      if (todo.length) toast('正在存入 ' + todo.length + ' 張圖片…');
      for (const k of todo) { try { await ImgDB.put(k, imgs[k]); up++; } catch (e) { bad++; } }
      D.wall = { cur: o.wall.cur, pages: clone(o.wall.pages || []), locked: !!o.wall.locked };
    }
    if (opt.cls && o.app === '班級百寶箱') {
      if (o.info && o.info.className) D.info.className = o.info.className;
      if (o.info && o.info.attPos) D.info.attPos = o.info.attPos;
      if (Array.isArray(o.students)) D.students = o.students.map(s => ({ id: s.id, no: +s.no || 0, name: String(s.name || '') }));
      if (o.sched) D.sched = clone(o.sched);
      if (o.board) D.board = clone(o.board);
      if (Array.isArray(o.timerTitles)) D.timerTitles = o.timerTitles.slice();
      if (Array.isArray(o.clockNotes)) D.clockNotes = o.clockNotes.slice();
    }
    if (opt.att && o.att && o.att[dateKey()]) D.att = { [dateKey()]: clone(o.att[dateKey()]) };
    D.src = { at: new Date().toISOString(), app: o.app };
    useData(D); Wall.sel = null;
    save(); saveNow(); Layers.slice().forEach(l => l.close()); Wall.draw();
    toast('匯入完成' + (opt.wall ? '：動態牆 ' + D.wall.pages.length + ' 頁' : '') + (opt.cls ? '、同學 ' + D.students.length + ' 位' : '') + (bad ? '（' + bad + ' 張圖片沒有存進來）' : ''), { ms: 6000 });
  },
  async exportFile() {
    const images = {}; let miss = 0;
    for (const k of wallImgRefs(D.wall)) {
      try {
        const u = await ImgDB.get(k); if (!u) { miss++; continue; }
        images[k] = u.startsWith('data:') ? u : await blobDataURL(await (await fetch(u)).blob());
      } catch (e) { miss++; }
    }
    const o = { app: '雲端動態牆', v: 1, exportedAt: new Date().toISOString(), info: { className: D.info.className }, wall: D.wall, images };
    if (miss) toast(miss + ' 張圖片讀不到，檔案裡不會有這幾張。');
    await download((D.info.className || '班級') + '-雲端動態牆-' + dateKey() + '.json', JSON.stringify(o), 'application/json');
  }
};

/* ---------- 名單、點名 ---------- */
const Roster = {
  open() {
    modal('名單', c => {
      const ta = h('textarea', { class: 'inp', id: 'rosterText', rows: 14, value: roster().map(s => pad(s.no) + ' ' + s.name).join('\n'), placeholder: '一行一位，例如：\n01 王小明\n02 李小華' });
      c.body.append(h('p', { class: 'muted' }, '一行一位同學，前面可以加座號。抽籤、應到實到、點名都用這份名單。從班級百寶箱匯入備份檔，也會自動帶入名單。'), ta);
      c.foot.append(h('button', { class: 'btn', onclick: () => c.close() }, '取消'), h('button', { class: 'btn pri', onclick: () => { this.apply(ta.value); c.close(); } }, '存好名單'));
    });
  },
  apply(text) {
    const used = new Set(), out = [];
    let next = 1;
    for (const l of text.split('\n').map(x => x.trim()).filter(Boolean)) {
      const m = l.match(/^(\d{1,2})[\s.、．:：)）-]*(.*)$/);
      let no = m ? +m[1] : 0;
      const name = (m ? m[2] : l).trim();
      if (!no || used.has(no)) { while (used.has(next)) next++; no = next; }
      used.add(no);
      const old = D.students.find(s => s.no === no);
      out.push({ id: old ? old.id : uid(), no, name });
    }
    D.students = out.sort((a, b) => a.no - b.no).slice(0, 60);
    save(); refresh(); toast('名單有 ' + D.students.length + ' 位同學');
  }
};
const Att = {
  NEXT: { '': 'sick', sick: 'personal', personal: 'late', late: '' },
  open() {
    modal('今天點名', c => {
      const t = dateKey(), A = D.att[t] || {};
      if (!D.students.length) {
        c.body.append(h('p', null, '還沒有名單。'), h('button', { class: 'btn pri', onclick: () => { c.close(); Roster.open(); } }, '👥 建立名單'));
        return;
      }
      c.body.append(h('div', { class: 'row wrap' }, h('b', null, fmtMD(new Date())), h('span', null, '應到 ' + D.students.length + ' 人，實到 ' + presentList().length + ' 人'), h('span', { class: 'grow' }),
          h('button', { class: 'btn sm', onclick: () => { delete D.att[t]; save(); c.rebuild(); } }, '全班都出席')),
        h('p', { class: 'muted small' }, '點一下名字換：出席 → 病假 → 事假 → 遲到。病假、事假不算實到，抽籤也不會抽到。'),
        h('div', { class: 'at-grid' }, roster().map(s => {
          const st = A[s.id] || '';
          return h('button', { class: 'at-btn ' + st, onclick: () => {
            const v = this.NEXT[st], a = D.att[t] || (D.att[t] = {});
            if (v) a[s.id] = v; else delete a[s.id];
            save(); c.rebuild();
          } }, h('span', null, nameOf(s)), st ? h('em', null, ABS[st]) : null);
        })));
    }, { cls: 'wide' });
  }
};

/* ---------- 選單 ---------- */
const Menu = {
  chip() { return h('button', { class: 'wbtn sync ' + Cloud.state, id: 'syncChip', title: '雲端同步的狀態', onclick: () => Menu.open() }, Cloud.label()); },
  open() {
    const fmtAt = s => { const d = new Date(s); return isNaN(d) ? '' : fmtMD(d) + ' ' + hm(d); };
    const item = (icon, t, sub, fn) => h('button', { class: 'mbtn', onclick: fn }, h('span', { class: 'mi' }, icon), h('span', null, h('b', null, t), h('small', null, sub)));
    const sec = (t, kids, note) => h('section', { class: 'msec' }, h('h3', null, t), h('div', { class: 'mgrid' }, kids), note ? h('p', { class: 'muted small' }, note) : null);
    modal('選單', c => {
      const cloud = Cloud.mode === 'cloud' || Cloud.mode === 'fb', go = fn => () => { c.close(); fn(); };
      c.body.append(
        h('div', { class: 'cloudbox' + (cloud ? '' : ' local') }, cloud
          ? (Cloud.mode === 'fb' ? [h('b', null, '☁ 存在雲端（' + FB.email + '）'), h('span', null, '和班級百寶箱共用同一份班級資料。換一台電腦，用同一個 Google 帳號登入就是同一面動態牆；在一台改了，別台開著的也會跟著變。')] : [])
          : [h('b', null, Cloud.mode === 'start' ? '☁ 正在連線…' : '💻 只存在這台電腦'), h('span', null, '資料存在這台電腦的這個瀏覽器裡，不會同步到別台電腦；清除瀏覽器的網站資料就會不見。要搬到別台電腦：按下面的「匯出動態牆」存檔，再到那台電腦的動態牆匯入。')]),
        Cloud.mode === 'fb' ? '' : sec('從班級百寶箱帶過來', [item('📥', '匯入班級百寶箱的備份檔', D.src ? '上次匯入：' + fmtAt(D.src.at) : '動態牆、名單、課表、聯絡簿', go(() => Sync.importFile()))],
          '在班級百寶箱按 ⚙ 設定 → 資料 → 匯出備份檔，再到這裡選那個 .json 檔。'),
        sec('班級資料', [
          Cloud.mode === 'fb' ? null : item('👥', '名單', D.students.length + ' 位同學', go(() => Roster.open())),
          item('✅', '今天點名', '實到 ' + presentList().length + '／' + D.students.length, go(() => Att.open())),
          item('📅', '作息與課表', D.sched.periods.length + ' 個時段', go(() => Sched.edit())),
          item('📒', '聯絡簿／黑板', '聯絡簿小工具顯示這裡的內容', go(() => Board.edit()))],
          '抽籤、應到實到、課表進度、考試面板「照課表」都會用到這些資料。' + (Cloud.mode === 'fb' ? '名單和分數請在班級百寶箱修改。' : '')),
        sec('帶回班級百寶箱', [item('📤', '匯出動態牆', '存成 .json 檔', go(() => Sync.exportFile()))],
          '在班級百寶箱按 ⚙ 設定 → 資料 → 匯入備份檔，選這個檔案：只會換掉動態牆，名單和分數不會變。'),
        h('section', { class: 'msec' }, h('h3', null, '其他'),
          h('label', { class: 'tog' }, h('input', { type: 'checkbox', id: 'optSound', checked: D.info.sound, onchange: e => { D.info.sound = e.target.checked; save(); if (D.info.sound) Snd.pop(); } }), h('span', null, '音效（抽籤、骰子；考試鈴聲不管這裡都會響）')),
          h('label', { class: 'lbl', for: 'optName' }, '班級名稱（匯出的檔名會用到）'),
          h('input', { class: 'inp', id: 'optName', value: D.info.className, oninput: e => { D.info.className = e.target.value; save(); } })));
    }, { cls: 'wide menu' });
  }
};

/* ---------- 讀取中、第一次使用 ---------- */
const Veil = { hide() { const v = document.getElementById('veil'); if (v) v.hidden = true; } };
const Welcome = {
  show() {
    modal('歡迎使用動態牆', c => {
      c.body.append(h('p', null, '這是班級百寶箱的動態牆，可以單獨使用。後面是「考試牆」範例：拖曳移動小工具、拉右下角調整大小、按 ⚙ 改設定，下面的工具列可以加入更多小工具。'),
        h('p', null, Cloud.mode === 'cloud' ? '資料存在你的 claude.ai 帳號，換電腦登入同一個帳號、打開這個網址，就是同一面牆。' : '資料存在這台電腦的瀏覽器，不會同步到別台電腦。'),
        h('div', { class: 'warnbox' }, h('b', null, '把原本的設定帶過來'), '在班級百寶箱按 ⚙ 設定 → 資料 → 匯出備份檔，再按下面的「匯入備份檔」選那個檔案：動態牆、名單、課表、聯絡簿都會帶過來。'));
      c.foot.append(h('button', { class: 'btn', onclick: () => c.close() }, '先用範例試試看'),
        h('button', { class: 'btn pri', onclick: () => { c.close(); Sync.importFile(); } }, '📥 匯入備份檔'));
    });
  }
};

/* ---------- 投影時不要讓螢幕睡著 ---------- */
let wakeLock = null;
async function keepAwake() {
  try { if (navigator.wakeLock && document.visibilityState === 'visible' && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { }
}
document.addEventListener('visibilitychange', keepAwake);

/* ---------- 啟動 ---------- */
// 刪掉最後一頁時，原本會「回教室」；雲端版沒有教室，改成給一頁空白牆
Wall.close = function () { if (!D.wall.pages.length) Wall.newPage('blank'); };
function boot() {
  D = defaultData(); ensurePage();
  Wall.open();
  Cloud.goLocal();
  keepAwake();
}
Gate.run({ local: boot, root: '../', title: '動態牆', icon: '📌', admin: data => { useData(data); Cloud.mode = 'fb'; Wall.open(); Veil.hide(); keepAwake(); } });

</script>
