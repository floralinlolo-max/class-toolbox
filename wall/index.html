<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動態牆</title>
<meta name="description" content="班級百寶箱的動態牆：可以單獨使用；設定 Google 登入後和班級百寶箱共用雲端資料。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* 班級百寶箱 */
:root {
  --bg: #f3eee4; --panel: #fffdf8; --panel2: #f6f0e4; --ink: #25313b; --muted: #6c7680; --line: #e0d6c4;
  --pri: #1f8a70; --yellow: #f6b93b; --yellow-ink: #3a2a05;
  --plus: #2e9d5b; --plus-tint: #e3f4e8; --minus: #d64545; --minus-tint: #fbe5e3;
  --board: #2d3a40; --chalk: #f4f0e2; --chalk-y: #ffd65a; --frame: #b8c0c4;
  --shadow: 0 8px 26px rgba(40, 30, 10, .14);
  --font: "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  --kai: "標楷體", "DFKai-SB", "BiauKai", "Kaiti TC", "STKaiti", "LXGW WenKai TC", serif;
  --title: "LXGW WenKai TC", "標楷體", "DFKai-SB", "BiauKai", "Kaiti TC", serif;
}
/* 黑板字體選霞鶩文楷（網路字型，沒網路時退回標楷體） */
html.font-wenkai { --kai: "LXGW WenKai TC", "標楷體", "DFKai-SB", "BiauKai", serif; }
/* 標題、工具列圖示用楷書感的字 */
.lhead h2, .cls, .dbtn .di, .wcard h3, .welcome h2, .set-h, .av-name, .th-name, .tabs button, .r-sign, .r-card b { font-family: var(--title); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); overflow: hidden;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "top top" "main side" "dock dock";
}
button { font: inherit; color: inherit; }

/* ---------- 上方列 ---------- */
#top { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.cls { font-size: 22px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; padding: 1px 14px; border-radius: 12px; letter-spacing: .08em; }
.chip-top.now { background: #1f3a30; border-color: #1f3a30; color: #fff; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.chip-top.tchip, .tchip-btn { display: inline-flex; align-items: center; gap: 6px; padding: 2px 12px 2px 3px; }
.tc-mini { display: inline-block; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex: none; }
.tc-mini svg, .av-pic svg, .tc-av svg { display: block; width: 100%; height: 100%; }
.cls:hover { background: var(--panel2); }
.chip-top { background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 3px 12px; font-size: 15px; cursor: pointer; white-space: nowrap; }
.chip-top.plain { cursor: default; }
.chip-top.timer { background: #fff1c9; border-color: var(--yellow); font-weight: 700; }
.chip-top.exam { background: var(--minus-tint); border-color: var(--minus); color: var(--minus); font-weight: 700; }
.tbtn { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
.tbtn:hover { background: var(--panel2); }
.grow { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }

/* ---------- 主畫面 ---------- */
#main { grid-area: main; display: flex; flex-direction: column; min-height: 0; padding: 10px 14px 6px; gap: 8px; }
.board { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; height: 23vh; min-height: 90px; flex: none;
  background: var(--board); border: 7px solid var(--frame); border-radius: 10px; color: var(--chalk); font-family: var(--kai); }
.board.small { height: 8vh; min-height: 50px; }
.b-main { overflow: hidden; padding: 6px 14px; cursor: pointer; min-width: 0; }
/* 倒數、應到實到、值日生寫在聯絡簿前面（Board.infoLines）：第一行倒數＋應到實到，第二行值日生，再空一行 */
/* 比聯絡簿的字小一號；段考、應到、實到、值日生用橘色粉筆，和聯絡簿標題的黃色分開 */
.bd-info, .bd-gap { font-size: .75em; }
.bd-info { white-space: nowrap; }
.bd-info em { font-style: normal; font-weight: 800; margin-inline: .15em; }
.bd-info .b-cd + .b-att { margin-inline-start: 1.6em; }
.bd-gap::before { content: '\a0'; }
.b-cd b, .b-tag { color: #ffaa6e; }
/* 主畫面黑板收小時：右邊一橫列（Board.sideBox） */
.b-side { display: flex; align-items: center; gap: 12px; padding: 0 26px 0 6px; font-size: 15px; white-space: nowrap; }
.b-side small { font-size: .8em; opacity: .9; }
.b-big { font-size: 1.15em; font-weight: 700; margin: 0 .1em; }
.b-side:empty { padding: 0; }
.b-min { position: absolute; right: 2px; bottom: 2px; background: rgba(255, 255, 255, .12); color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-size: 12px; padding: 0 6px; }

/* 黑板上的字 */
.bd { width: 100%; line-height: 1.35; }
/* 直書從黑板最右邊開始寫（一直行一直行往左） */
.bd.vert { writing-mode: vertical-rl; height: 100%; width: fit-content; display: block; margin-left: auto; }
.bd-h { color: var(--chalk-y); font-weight: 700; }
.bd-it { margin: .1em 0; white-space: nowrap; }
.bd-n { color: #b9c4bf; margin-inline-end: .25em; }
.bd-cat { font-weight: 700; margin-inline-end: .2em; }
/* 直書：數字併成一格橫寫、英文字母直立、～轉成直的（vtHTML） */
.tcy { text-combine-upright: all; }
.upr { text-orientation: upright; }
.sdw { text-orientation: sideways; }
.c-hw { color: #ffd65a; } .c-bring { color: #8fe3ff; } .c-test { color: #ff9aa8; } .c-note { color: #b9f5c0; }
select.c-hw, select.c-bring, select.c-test, select.c-note { color: var(--ink); }
.ck-r { color: #ff8080; } .ck-y { color: #ffe066; } .ck-b { color: #7cc4ff; } .ck-g { color: #8ff0a4; }
.bd-empty { opacity: .55; font-size: .8em; }

#banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #fff7dd; border: 2px solid var(--yellow); border-radius: 12px; padding: 6px 10px; flex: none; }
.bn-t { font-weight: 700; margin-right: auto; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper b { min-width: 1.5em; text-align: center; }

#seats { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.desk { align-self: center; padding: 1px 34px; background: #e2d2b4; border-radius: 8px; font-size: 13px; color: #5a4630; flex: none; }
.grid { flex: 1; min-height: 0; display: grid; gap: 8px; }
.seat {
  position: relative; border: 2px solid var(--line); background: var(--panel); border-radius: 12px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; cursor: pointer; container-type: size; padding: 2px; min-height: 0; min-width: 0; overflow: hidden;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .06); transition: transform .1s;
}
.seat:hover { transform: translateY(-1px); border-color: #cdbfa6; }
.seat .no { position: absolute; left: 6px; top: 2px; font-size: max(11px, 17cqh); color: var(--muted); font-weight: 800; line-height: 1.2; }
.seat .nm { font-size: clamp(12px, min(30cqh, 21cqw), 54px); font-weight: 800; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.seat .sc { position: absolute; right: 5px; top: 3px; background: var(--plus-tint); color: var(--plus); border-radius: 20px; padding: 0 7px; font-weight: 800; font-size: max(11px, 16cqh); line-height: 1.4; }
.seat .sc.neg { background: var(--minus-tint); color: var(--minus); }
.seat.grouped { box-shadow: inset 0 -7px 0 var(--gc), 0 2px 0 rgba(0, 0, 0, .06); }
.seat.sel { outline: 4px solid var(--yellow); outline-offset: 1px; }
.seat.picked { background: #fff1c4; border-color: var(--yellow); }
.seat.absent { opacity: .45; background: #ece9e3; }
.seat.empty { background: transparent; border: 2px dashed #d8cfbf; cursor: default; box-shadow: none; color: var(--muted); font-size: 13px; }
.seat.empty.can { cursor: pointer; }
.seat.empty.can:hover { background: #fff8e3; }
.badge { position: absolute; right: 5px; bottom: 4px; border-radius: 6px; padding: 0 6px; font-size: max(11px, 15cqh); font-weight: 800; color: #fff; line-height: 1.4; }
.badge.hw-miss, .badge.hw-fix, .badge.hw-done { right: auto; left: 5px; }
.att-sick { background: #7b6bd6; } .att-personal { background: #5b8def; } .att-late { background: #e69b2e; }
.hw-miss { background: var(--minus); } .hw-fix { background: #e69b2e; } .hw-done { background: var(--plus); }
.float { position: absolute; top: 25%; font-size: max(20px, 34cqh); font-weight: 900; animation: floatUp 1.2s ease-out forwards; pointer-events: none; }
.float.up { color: var(--plus); } .float.down { color: var(--minus); }
.tray { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px; border: 2px dashed var(--line); border-radius: 12px; flex: none; max-height: 30%; overflow: auto; }
.tray .seat { width: 112px; height: 58px; flex: none; }
.tray-t { font-size: 14px; color: var(--muted); }
.flat-top { position: relative; display: flex; justify-content: center; flex: none; }
.flat-top .btn { position: absolute; right: 0; top: -4px; }

/* ---------- 3D 教室 ---------- */
.r-view { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 14px; background: radial-gradient(ellipse at 50% 0%, #fdf8ee, #e4d9c6); }
.r-scale { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.r-cam { position: relative; perspective-origin: 50% 42%; }
.r-floor { position: absolute; left: 0; top: 0; transform-style: preserve-3d;
  background: repeating-linear-gradient(90deg, rgba(90, 50, 15, .14) 0 2px, transparent 2px 64px),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .06) 0 40px, rgba(0, 0, 0, .03) 40px 80px),
    linear-gradient(#cf9a60, #ddab73); }
.r3 { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.r3 > svg { display: block; width: 100%; height: 100%; overflow: visible; }
.r-shadow { background: radial-gradient(closest-side, rgba(70, 40, 10, .3), transparent); pointer-events: none; }
.bf { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.r-view { cursor: grab; touch-action: none; }
.r-view.dragging { cursor: grabbing; }
.r-view.dragging .r-teacher { transition: none; }
.r-ctl3 { position: absolute; right: 10px; top: 10px; z-index: 3; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.r-ctl3 .btn { background: rgba(255, 255, 255, .9); box-shadow: 0 2px 6px rgba(0, 0, 0, .12); }
.r-hint { font-size: 12px; color: var(--muted); background: rgba(255, 255, 255, .75); border-radius: 8px; padding: 2px 8px; }
@media (max-width: 1000px), (max-height: 560px) { .r-hint { display: none; } }
/* 前牆的黑板（學生視角看得到） */
.r-chalk { position: absolute; left: 50%; top: 52px; height: 162px; transform: translateX(-50%); background: var(--board); border: 9px solid #b9925f; border-radius: 6px; color: var(--chalk); font-family: var(--kai);
  padding: 8px 14px; overflow: hidden; font-size: 20px; cursor: pointer; pointer-events: auto; box-shadow: inset 0 0 18px rgba(0, 0, 0, .35); }
.r-chalk::after { content: ''; position: absolute; left: 10%; right: 10%; bottom: 0; height: 6px; background: #d9c39b; }
.r-chalk .bd-empty { font-size: 16px; }
.r-wall.front .r-fp { position: absolute; top: 80px; transform: translateX(-50%); }
.r-desk-back { cursor: pointer;
  background: linear-gradient(#d4a26a, #c4935a) top / 100% 14px no-repeat, linear-gradient(#8e98a1, #8e98a1) 6px 14px / 7px 100% no-repeat, linear-gradient(#8e98a1, #8e98a1) right 6px top 14px / 7px 100% no-repeat; }
.r-cub-back { background: #a87a46; }
.r-td-back { background: #c68c52; border: 5px solid #ad773f; }
/* 從後面看：同學換成背影 */
.r-kid .bk { display: none; }
.r-view.behind .r-kid .bk { display: inline; }
.r-prop { pointer-events: none; }
/* 牆 */
.r-wall { --wain: #9fd3c1; --wallc: #f7efdf; overflow: hidden; pointer-events: none;
  background: linear-gradient(to top, #7fb8a5 0 6px, var(--wain) 6px 92px, #fff 92px 98px, var(--wallc) 98px); }
.r-wall.side { --wain: #8fc4b2; --wallc: #ede1cb; }
.r-wall .r-bb { pointer-events: auto; }
.r-bunt { position: absolute; left: 0; top: 0; line-height: 0; }
.r-sign { position: absolute; top: 152px; transform: translateX(-50%); padding: 4px 16px; background: #fffdf6; border: 4px solid #e2a54d; border-radius: 10px; font: 700 26px/1.3 var(--title); color: #6b4a1f; white-space: nowrap; box-shadow: 0 3px 0 rgba(0, 0, 0, .1); }
.r-bb { position: absolute; left: 50%; top: 62px; height: 142px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 8px;
  background: #d8b083; border: 7px solid #6fae98; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 0 rgba(0, 0, 0, .12); }
.r-bb:hover { border-color: var(--yellow); }
.r-card { position: relative; background: #fffdf3; border-radius: 3px; padding: 6px 6px 4px; font-size: 13px; line-height: 1.35; color: #4a3b2a; overflow: hidden; box-shadow: 0 2px 3px rgba(0, 0, 0, .15); }
.r-card::before { content: ''; position: absolute; left: 50%; top: 2px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: #e8574a; }
.r-card b { display: block; text-align: center; font-size: 15px; color: #1f6f5b; border-bottom: 2px dashed #e5d5b5; margin: 4px 0 3px; white-space: nowrap; }
.r-card div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-card.c2 { background: #fff6cf; } .r-card.c3 { background: #e5f3ff; } .r-card.c4 { background: #ffe8ef; }
.r-empty { color: #a59a88; text-align: center; }
.r-clock { position: absolute; top: 146px; transform: translateX(-50%); width: 72px; height: 72px; cursor: pointer; pointer-events: auto; }
.r-clock svg { display: block; width: 100%; height: 100%; }
.r-clock.dg { width: 118px; height: 46px; top: 154px; background: #24302c; border: 4px solid #2f4a3f; border-radius: 10px; display: grid; place-items: center; }
.r-clock.dg b { color: #8ff0b0; font: 700 28px/1 Consolas, "Courier New", monospace; letter-spacing: .04em; text-shadow: 0 0 6px rgba(120, 255, 170, .6); }
.r-deco { position: absolute; top: 214px; transform: translateX(-50%); display: flex; gap: 6px; align-items: flex-start; }
.r-deco svg { display: block; height: 62px; width: auto; }
.r-view[data-theme="cny"] .r-deco svg { height: 92px; }
.r-poster { padding: 6px 12px; background: #fffdf3; border: 3px solid #6fae98; border-radius: 6px; font: 700 22px/1.2 var(--kai); color: #2f4a3f; white-space: nowrap; box-shadow: 0 3px 0 rgba(0, 0, 0, .1); }
.r-poster.pink { border-color: #ef7f9f; color: #c0395c; background: #fff0f4; }
.r-poster.green { border-color: #5b8c5f; color: #3c6b40; }
.r-poster.exam { border-color: #4f6f85; color: #2c4456; background: #f4f8fb; font-size: 26px; }
.r-doorsign { position: absolute; left: 50%; top: 86px; transform: translateX(-50%); padding: 4px 8px; background: #fff; border: 3px solid #4f6f85; border-radius: 4px; font: 700 18px/1.2 var(--kai); color: #2c4456; white-space: nowrap; }
.r-herbs { position: absolute; top: 70px; width: 36px; }
.r-herbs svg { display: block; width: 100%; height: auto; }
/* 冷氣 */
.r-ac { position: absolute; top: 62px; width: 128px; height: 44px; transform: translateX(-50%); background: linear-gradient(#ffffff, #e9eef2); border: 2px solid #c9d2da; border-radius: 10px 10px 14px 14px; cursor: pointer; pointer-events: auto; box-shadow: 0 3px 0 rgba(0, 0, 0, .08); }
.r-ac i { position: absolute; left: 10px; right: 10px; bottom: 6px; height: 6px; border-radius: 3px; background: #c9d2da; }
.r-ac-led { position: absolute; right: 10px; top: 6px; min-width: 26px; height: 16px; border-radius: 4px; background: #33403b; color: #8ff0b0; font: 700 12px/16px Consolas, monospace; text-align: center; }
.r-ac:not(.on) .r-ac-led { background: #cfd6dc; }
.r-ac.on { border-color: #8fc4e8; }
.r-wind { position: absolute; left: 2px; right: 2px; top: 100%; height: 42px; pointer-events: none; }
.r-wind svg { display: block; width: 100%; height: 100%; }
.r-wind path { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 10 9; opacity: .75; animation: windFlow 1.1s linear infinite; }
@keyframes windFlow { to { stroke-dashoffset: -38; } }
.r-remote { cursor: pointer; }
.r-remote > svg { display: block; width: 100%; height: 100%; }
.acp .lbox { max-width: 360px; }
.rmt { background: #eef1f4; border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 12px; border: 2px solid #c9d2da; }
.rmt-lcd { background: #c9d7cf; border-radius: 12px; padding: 10px 14px; color: #33403b; position: relative; min-height: 96px; }
.rmt-lcd.on { background: #bfe6d2; }
.rmt-t { font: 700 40px/1.1 Consolas, monospace; }
.rmt-s { font-size: 15px; }
.rmt-leaf { position: absolute; right: 12px; top: 10px; font-weight: 700; color: #2e7d4f; }
.rmt-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rmt-temp { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; justify-content: center; font-weight: 700; }
.rbtn { border: 0; border-radius: 14px; padding: 12px; background: #fff; box-shadow: 0 3px 0 #c3ccd4; cursor: pointer; font-weight: 700; font-size: 17px; }
.rbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c3ccd4; }
.rbtn.power { background: #e8574a; color: #fff; box-shadow: 0 3px 0 #b33d33; }
.rmt-temp .rbtn { min-width: 64px; }
/* 地板：磨石子 */
.r-floor.terrazzo { background:
  radial-gradient(circle at 20% 30%, rgba(60, 60, 60, .22) 0 1.4px, transparent 1.9px) 0 0 / 23px 19px,
  radial-gradient(circle at 70% 60%, rgba(150, 120, 90, .3) 0 1.2px, transparent 1.7px) 0 0 / 31px 27px,
  radial-gradient(circle at 40% 80%, rgba(255, 255, 255, .8) 0 1.5px, transparent 2px) 0 0 / 17px 21px,
  repeating-linear-gradient(90deg, rgba(150, 120, 70, .4) 0 2px, transparent 2px 150px),
  repeating-linear-gradient(0deg, rgba(150, 120, 70, .4) 0 2px, transparent 2px 150px),
  linear-gradient(#cfccc4, #dad7cf); }
.r-on { position: absolute; inset: 0; pointer-events: none; }
.r-on svg { display: block; width: 100%; height: 100%; }
.r-rug { border-radius: 50%; background: repeating-radial-gradient(circle, #f6c445 0 10px, #f39257 10px 20px, #7fcfc0 20px 30px); opacity: .85; pointer-events: none; }
/* 小小宣導員 */
.r-herald { cursor: pointer; }
.r-herald > svg { position: absolute; left: 12px; top: 0; width: 126px; height: 300px; overflow: visible; }
.r-hsign { position: absolute; left: 0; width: 150px; top: 6px; height: 92px; padding: 4px 8px; background: #fffdf3; border: 4px solid #e2a54d; border-radius: 8px; display: grid; place-items: center;
  text-align: center; font-family: var(--kai); font-weight: 700; color: #6b4a1f; line-height: 1.2; box-shadow: 0 3px 0 rgba(0, 0, 0, .15); }
.r-anchor { pointer-events: none; }
.r-ctl2 { position: absolute; left: 10px; top: 10px; z-index: 3; }
.r-ctl2 .btn { background: #fff7dd; border-color: var(--yellow); font-weight: 700; }
.r-lw.hd .seat { font-size: .9em; }
/* 表情與小動作（精緻） */
.r-kid .fh, .r-kid .fs, .r-herald .fh, .r-herald .fs, .r-teacher .fh, .r-teacher .fs { display: none; }
.happy .fn, .wow .fn { display: none; }
.happy .fh, .wow .fs { display: inline; }
.blink .eyes { transform: scaleY(.12); transform-box: fill-box; transform-origin: center; }
.r-view.fine .r-kid[data-id] > svg, .r-view.fine .r-herald > svg { transform-origin: 50% 100%; animation: sway 3.4s ease-in-out var(--d, 0s) infinite alternate; }

/* ---------- 扭蛋機 ---------- */

.gk button { font-size: 16px; padding: 6px 14px; }

.g-cap .top, .g-cap .bot { position: absolute; left: 0; width: 110px; height: 55px; }

.g-cap .bot { bottom: 0; background: #fff; border: 2px solid #ddd; border-radius: 0 0 55px 55px; animation: capBot .7s .15s forwards; }
.glist { display: flex; flex-direction: column; }
.grow-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.grow-row > .inp:first-child { flex: 1; min-width: 10em; }
.grow-row .row { margin: 0; }

/* ---------- 小組 ---------- */
.gb-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); flex: 1; align-content: center; }
.gb-card { background: var(--panel); border-radius: 20px; border-top: 14px solid var(--gc); padding: 14px; text-align: center; box-shadow: var(--shadow); }
.gb-name { font-size: 26px; font-weight: 800; color: var(--gc); }
.gb-score { font-size: 64px; font-weight: 900; line-height: 1.1; }
.gb-mem { display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: center; font-size: 18px; margin-top: 8px; }
.gb-mem .abs { opacity: .45; }
.gs-cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 12px; }
.gs-col { border: 2px solid var(--line); border-top: 8px solid var(--gc); border-radius: 12px; padding: 8px; cursor: pointer; min-height: 90px; }
.gs-col.on { border-color: var(--gc); box-shadow: inset 0 0 0 2px var(--gc); background: #fffbef; }
.gs-mem { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.gs-mem .chip { font-size: 13px; padding: 2px 8px; }
.comp-res { display: flex; flex-direction: column; gap: 12px; max-width: 760px; margin: auto; width: 100%; }
.comp-row { display: flex; gap: 16px; align-items: center; font-size: 30px; background: var(--panel); border-left: 14px solid var(--gc); border-radius: 14px; padding: 12px 20px; box-shadow: var(--shadow); }
.comp-row .nm { flex: 1; font-weight: 800; }
.comp-row .rk { color: var(--muted); font-size: 22px; }

/* ---------- 分數榜 ---------- */
.rk-top { display: flex; justify-content: space-between; align-items: center; }
.podium-wrap { flex: 1; display: flex; flex-direction: column; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 16px; margin: 10px 0 24px; }
.pd-col { width: min(26vw, 280px); text-align: center; }
.pd-names { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
.pd-n { font-size: clamp(18px, 2.8vw, 34px); font-weight: 800; }
.pd-n small { color: var(--muted); font-size: .6em; }
.pd-step { border-radius: 16px 16px 0 0; display: flex; flex-direction: column; align-items: center; padding-top: 10px; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.p1 .pd-step { height: 28vh; background: linear-gradient(#f7c948, #e0a516); }
.p2 .pd-step { height: 20vh; background: linear-gradient(#cfd8e0, #9aa8b5); }
.p3 .pd-step { height: 14vh; background: linear-gradient(#e6aa72, #c07a3e); }
.pd-medal { font-size: 46px; }
.pd-sc { font-size: 24px; font-weight: 900; }
.rk-rest { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.rk-item { display: flex; gap: 10px; align-items: center; background: var(--panel); border-radius: 10px; padding: 8px 12px; font-size: 18px; }
.rk-item span:nth-child(2) { flex: 1; }
.rk-no { color: var(--muted); background: var(--panel2); border-radius: 50%; width: 1.9em; height: 1.9em; display: inline-grid; place-items: center; font-size: 14px; flex: none; }
.rk-no:empty { background: none; }
.hist-row { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.hist-row input { width: 20px; height: 20px; }

/* ---------- 作業、我好了、點名 ---------- */
.hwrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
.hw-t { flex: 1; min-width: 10em; }
.hwrow .row { margin: 0; }
.tag { border-radius: 8px; padding: 2px 8px; font-size: 13px; font-weight: 700; margin-right: 4px; }
.tag.miss { background: var(--minus-tint); color: var(--minus); }
.tag.fix { background: #fff0d4; color: #b26a00; }
.tag.done { background: var(--plus-tint); color: var(--plus); }
.owe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.owe { border-radius: 16px; padding: 12px; text-align: center; background: var(--panel); border: 3px solid; }
.owe b { display: block; font-size: 52px; line-height: 1.1; }
.owe span { display: block; font-size: 22px; color: var(--ink); font-weight: 700; }
.owe small { font-size: 15px; }
.owe.miss { border-color: var(--minus); color: var(--minus); }
.owe.fix { border-color: #e69b2e; color: #b26a00; }
.owe-grid.sm { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.owe-grid.sm b { font-size: 30px; }
.owe-sec h3 { margin: 14px 0 6px; }
.bigmsg { font-size: 60px; text-align: center; margin: auto; font-weight: 800; }
.attlist { display: flex; flex-direction: column; }
.attrow { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.attrow .nm { font-weight: 700; }
.rd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.rd-btn { position: relative; border: 3px solid var(--line); border-radius: 18px; background: var(--panel); padding: 12px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; user-select: none; touch-action: manipulation; }
.rd-no { font-size: 20px; color: var(--muted); font-weight: 800; }
.rd-nm { font-size: 30px; font-weight: 900; line-height: 1.2; }
.rd-btn.ok { background: #dff5e6; border-color: var(--plus); }
.rd-btn.abs { opacity: .35; cursor: default; }
.rd-mark { position: absolute; right: 8px; top: 4px; font-size: 28px; color: var(--plus); font-weight: 900; }
.rd-count { font-size: 22px; font-weight: 800; }
.rd-timer { font-size: 22px; font-weight: 800; margin-left: 10px; }
.rd-timer.warn { color: #d18a00; }
.rd-timer.end { color: var(--minus); }
.rd-all { text-align: center; font-size: 40px; font-weight: 900; color: var(--plus); margin-bottom: 10px; }
.bigplus { position: absolute; left: 50%; top: 45%; font-size: 180px; font-weight: 900; color: var(--plus); animation: bigUp .9s forwards; pointer-events: none; z-index: 10; }

/* ---------- 計時器 ---------- */
.timerp .lbody { align-items: center; justify-content: center; gap: 12px; }
.tm-title { font: inherit; font-size: 34px; text-align: center; border: 0; border-bottom: 2px dashed var(--line); background: none; width: min(700px, 90%); font-weight: 800; color: var(--ink); }
.tm-title:focus { outline: none; border-color: var(--pri); }
.tm-digits { font-size: min(24vw, 38vh); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: .02em; }
.tm-box.warn .tm-digits { color: #d18a00; }
.tm-box.end .tm-digits { color: var(--minus); animation: blink 1s steps(2) infinite; }
/* 計時器的指針式錶面（timerDial，計時器和動態牆共用）：紅色扇形是剩下的時間，碼錶是藍色 */
.analog .wedge { fill: #ff8a8a; }
.analog .wedge.up { fill: #8cc8f2; }
.tm-box.ana { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tm-box.ana .tdial { display: block; height: min(40vh, 62vw); width: auto; }
.tm-box.ana .tm-digits { font-size: 7vh; }
.tm-box.ana.warn .wedge, .w-timer.ana.warn .wedge { fill: #ffbe5c; }
.tm-box.ana.end .tdial { animation: blink 1s steps(2) infinite; }

/* ---------- 黑板編輯 ---------- */
.bed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.bed-right { position: sticky; top: 0; align-self: start; }
.bd-prev { background: var(--board); border: 6px solid var(--frame); border-radius: 10px; height: 46vh; overflow: hidden; color: var(--chalk); font-family: var(--kai); padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; }
.bd-prev .bd-box { padding: 0; }
.ct-row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
.ct-row select.inp { width: 5.5em; flex: none; }
.ct-row .inp:not(select) { flex: 1; }
textarea.free { min-height: 200px; font-size: 17px; margin-top: 6px; }
.chalk-紅 { color: #d63c3c; } .chalk-黃 { color: #b88600; } .chalk-藍 { color: #2a62c9; } .chalk-綠 { color: #1f8f4e; }
.emo { position: relative; display: inline-block; }
.emo summary { list-style: none; }
.emo summary::-webkit-details-marker { display: none; }
.emo-grid { position: absolute; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; box-shadow: var(--shadow); width: 300px; }
.emo-grid button { border: 0; background: none; font-size: 22px; cursor: pointer; border-radius: 6px; }
.emo-grid button:hover { background: var(--panel2); }
.bed-side { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 2px; }

/* 黑板投影 */
.boardp .lbody { padding: 0 !important; }
.bd-stage { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; background: var(--board); color: var(--chalk); font-family: var(--kai); border: 14px solid var(--frame); min-height: 0; }
.bd-box { overflow: hidden; padding: 2vh 2vw; min-width: 0; min-height: 0; }

/* ---------- 課表、大時鐘 ---------- */
.sched th small { display: block; color: var(--muted); font-weight: 400; font-size: .6em; }
.sched .today { background: #fff4d6; }
.sched tr.now td, .sched tr.now th { background: #ffe39b; }
.sched tr.other th { color: var(--muted); font-weight: 400; }
.sched td.exam { color: var(--minus); font-weight: 800; }
.schedp .tbl { font-size: 24px; }
.schedp .tblwrap { max-height: none; flex: 1; }
.sched-ed .inp { min-width: 6em; }
.inp.exam { background: #fff3c4; color: var(--minus); font-weight: 700; }
.per-row { display: flex; gap: 6px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
.per-row .inp { width: auto; }

.ov.proj.clockp, .lockscreen { background: #1f2a30; color: #f4f0e2; }
.clockp .lbox { background: #1f2a30; }
.clockp .lhead, .clockp .lfoot { background: #18222a !important; color: #fff; border-color: #33424c; }
.clockp .lhead .x { color: #ccd; }
.clockp .lbody { align-items: center; justify-content: center; }
.bc { display: flex; flex-direction: column; align-items: center; gap: 1vh; width: 100%; }
.bc-date, .ls-date { font-size: 4vh; opacity: .85; }
.bc-time, .ls-time { font-size: min(21vw, 30vh); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: .02em; }
.bc.analog .bc-time, .lockscreen.analog .ls-time { font-size: 7vh; }
.bc-analog { height: 52vh; aspect-ratio: 1; }
.bc-analog svg { height: 100%; width: 100%; }
.bc-per, .ls-per { font-size: 6vh; font-weight: 800; color: #ffd65a; min-height: 1em; }
.bc-per.exam, .ls-per.exam { color: #ff9a9a; }
.bc-left, .ls-left, .ls-tm { font-size: 4.2vh; }
.bc-note { border: 3px dashed rgba(255, 255, 255, .55); border-radius: 16px; padding: 1vh 3vw; font-size: 4.5vh; margin-top: 1vh; font-family: var(--kai); }
.analog .face { fill: #fffdf6; stroke: #30404a; stroke-width: 3; }
.analog .tk { stroke: #8a959d; stroke-width: 1; }
.analog .tk.big { stroke: #30404a; stroke-width: 3; }
.analog .num { font-size: 15px; fill: #30404a; font-weight: 700; font-family: var(--font); }
.analog .hh { stroke: #30404a; stroke-width: 6; stroke-linecap: round; }
.analog .mh { stroke: #30404a; stroke-width: 4; stroke-linecap: round; }
.analog .sh { stroke: #e04848; stroke-width: 1.6; stroke-linecap: round; }
.analog .pin { fill: #e04848; }

/* ---------- 螢幕鎖 ---------- */
.lockscreen { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2vh; }
.ls-unlock { position: absolute; right: 20px; bottom: 20px; background: rgba(255, 255, 255, .12); color: #fff; border: 1px solid rgba(255, 255, 255, .3); border-radius: 12px; padding: 10px 18px; cursor: pointer; }
.pin-dots { display: flex; gap: 14px; justify-content: center; margin: 10px; }
.pin-dots span { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink); }
.pin-dots span.on { background: var(--ink); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: auto; }
.inp.pin { font-size: 30px; letter-spacing: .5em; text-align: center; width: 8em; }

/* ---------- 動態牆 ---------- */
.wall { position: fixed; inset: 0; z-index: 50; background: #333; user-select: none; -webkit-user-select: none; }
.w-canvas { position: absolute; inset: 0; overflow: hidden; }
.w-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; color: rgba(0, 0, 0, .45); pointer-events: none; padding: 20px; text-align: center; }
.w-canvas.dark .w-empty { color: rgba(255, 255, 255, .65); }
.w-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; z-index: 20000; pointer-events: none; }
.w-top > * { pointer-events: auto; }
.wbtn { background: rgba(255, 255, 255, .94); border: 1px solid rgba(0, 0, 0, .12); border-radius: 12px; padding: 6px 14px; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); color: #25313b; white-space: nowrap; }
.wbtn:hover { background: #fff; }
.wbtn:disabled { opacity: .4; cursor: default; }
.wbtn.yellow { background: var(--yellow); font-weight: 800; color: var(--yellow-ink); }
.w-dock { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 2px; background: rgba(255, 255, 255, .97); border-radius: 18px; padding: 6px 8px; box-shadow: 0 6px 24px rgba(0, 0, 0, .22); z-index: 20000; max-width: calc(100% - 330px); overflow-x: auto; }
.wd-add { display: flex; flex-direction: column; align-items: center; border: 0; background: none; padding: 3px 7px; border-radius: 12px; cursor: pointer; color: #25313b; min-width: 54px; }
.wd-add span { font-size: 23px; line-height: 1.2; }
.wd-add small { font-size: 12px; white-space: nowrap; }
.wd-add:hover { background: #f1ece2; }
.w-nav { position: absolute; right: 12px; bottom: 14px; display: flex; gap: 4px; align-items: center; z-index: 20000; }
.w-pname { background: rgba(255, 255, 255, .94); border: 1px solid rgba(0, 0, 0, .12); border-radius: 12px; padding: 6px 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.wall.locked .w-top, .wall.locked .w-nav { opacity: .3; transition: opacity .3s; }
.wall.locked .w-top:hover, .wall.locked .w-nav:hover { opacity: 1; }
.wd { position: absolute; touch-action: none; }
.wall:not(.locked) .wd { cursor: move; }
.wd-body { position: absolute; inset: 0; container-type: size; border-radius: 18px; }
.wd.sel { outline: 3px dashed #2a7de1; outline-offset: 4px; border-radius: 18px; }
.wd.dragging { opacity: .85; }
.wd-bar { position: absolute; top: -46px; left: 50%; transform: translateX(-50%); display: none; gap: 2px; background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0, 0, 0, .22); padding: 3px; z-index: 3; }
.wd.bar-in .wd-bar { top: auto; bottom: -46px; }
.wd.sel .wd-bar { display: flex; }
.wd-bar button { border: 0; background: none; font-size: 18px; cursor: pointer; padding: 3px 8px; border-radius: 8px; }
.wd-bar button:hover { background: #eef2fb; }
.wd-rs { position: absolute; right: -8px; bottom: -8px; width: 22px; height: 22px; border-radius: 6px; background: #2a7de1; border: 3px solid #fff; cursor: nwse-resize; display: none; z-index: 3; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
.wd.sel .wd-rs { display: block; }
.wall.locked .wd-bar, .wall.locked .wd-rs { display: none !important; }
.wall.locked .wd.sel { outline: none; }
[contenteditable="true"] { user-select: text; -webkit-user-select: text; cursor: text; outline: 2px solid #2a7de1 !important; }

.w-card { position: absolute; inset: 0; background: rgba(255, 255, 255, .95); border-radius: 18px; box-shadow: 0 6px 20px rgba(0, 0, 0, .16); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4cqmin; color: #25313b; overflow: hidden; gap: 2cqmin; border: 0; }
.wbtn { font-size: max(13px, min(4.5cqmin, 18px)); }
/* 時鐘 */
.wc-analog { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; }
.wc-analog svg { height: 100%; max-width: 100%; }
.wc-time { font-size: 15cqmin; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.w-clock.digital .wc-time { font-size: min(40cqh, 26cqw); }
.wc-date { font-size: 7cqmin; color: #5d6871; }
.wc-per { font-size: 7cqmin; font-weight: 700; color: var(--pri); }
.wc-per:empty, .wc-date:empty { display: none; }
/* 考試面板 */
/* 考試面板：字和間距都用 --u（= --k × 1cqh），放不下時程式把 --k 調小，整個面板一起縮（fitExam） */
.w-exam { --u: calc(var(--k, 1) * 1cqh); justify-content: flex-start; align-items: stretch; gap: calc(2.4 * var(--u)); padding: calc(4 * var(--u)) 4cqw; }
.we-title { text-align: center; font-size: calc(8 * var(--u)); font-weight: 800; line-height: 1.1; }
.we-card { background: #fff; border: 1px solid #e3e6ea; border-radius: calc(2.5 * var(--u)); padding: calc(3 * var(--u)) 3.5cqw; display: flex; flex-direction: column; gap: calc(1.8 * var(--u)); box-shadow: 0 2px 8px rgba(0, 0, 0, .06); flex-shrink: 0; }
.we-subj { font-size: calc(9 * var(--u)); font-weight: 900; line-height: 1.15; }
.we-row { display: flex; align-items: center; gap: 2cqw; font-size: calc(6 * var(--u)); font-variant-numeric: tabular-nums; }
.we-bar { flex: 1; height: calc(3.4 * var(--u)); background: #e6e9ee; border-radius: 3cqh; overflow: hidden; }
.we-bar i { display: block; height: 100%; width: 0; background: #e8a23a; border-radius: 3cqh; transition: width .6s; }
.we-left { font-size: calc(6.5 * var(--u)); font-weight: 700; color: #3c4a55; }
.we-card.warn .we-bar i { background: #e04848; }
.we-card.warn .we-left { color: #e04848; }
.we-card.over .we-bar i { background: #9aa5ad; }
.we-card.idle .we-left { color: #6c7680; font-weight: 400; }
.we-card.brk { background: #effaf2; border-color: #bfe3c8; }
.we-card.brk .we-bar i { background: #43a865; }
.we-quick { display: flex; justify-content: center; }
.w-exam .we-quick .wbtn { font-size: max(12px, min(calc(4.5 * var(--u)), 18px)); padding: .3em .9em; }
.we-att { display: flex; gap: 2cqw; flex-shrink: 0; }
.we-att > div { flex: 1; background: #eef1f5; border-radius: calc(2 * var(--u)); padding: calc(1.8 * var(--u)); text-align: center; font-size: calc(6 * var(--u)); }
.we-att b { font-size: calc(8 * var(--u)); margin: 0 .15em; }
/* 提醒文字用自己的顏色（--nc，設定裡可換），底色是同色的淡色 */
.we-note { --nc: #d9480f; color: var(--nc); border: 2px dashed var(--nc); background: #fff6ef; background: color-mix(in srgb, var(--nc) 7%, #fff); border-radius: calc(2 * var(--u)); padding: calc(1.8 * var(--u)) 3cqw; font-size: calc(6 * var(--u)); text-align: center; font-family: var(--kai); font-weight: 700; flex-shrink: 0; }
.we-ncs { display: flex; flex-wrap: wrap; gap: 6px; }
.we-nc { border: 2px solid var(--nc); color: var(--nc); background: #fff; border-radius: 999px; padding: 3px 12px; font: inherit; font-weight: 700; cursor: pointer; }
.we-nc.on { background: var(--nc); color: #fff; }
/* 下方列出全部科目 */
.we-list { display: flex; flex-direction: column; gap: calc(.8 * var(--u)); font-size: calc(5 * var(--u)); flex-shrink: 0; }
.we-li { display: grid; grid-template-columns: 1fr auto 28%; gap: 2cqw; align-items: center; }
.we-li.cur { font-weight: 800; }
.we-li.past { opacity: .5; }
.we-mini { height: calc(1.6 * var(--u)); background: #e6e9ee; border-radius: 2cqh; overflow: hidden; }
.we-mini i { display: block; height: 100%; background: #2fa36b; }
/* 計時器 */
.wt-title { font-size: 9cqmin; font-weight: 700; }
.wt-dig { font-size: min(32cqh, 23cqw); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.wt-bar { width: 90%; height: 4cqh; background: #e6e9ee; border-radius: 3cqh; overflow: hidden; }
.wt-bar i { display: block; height: 100%; background: var(--pri); }
.w-timer.warn .wt-dig { color: #d18a00; }
.w-timer.end .wt-dig { color: #e04848; animation: blink 1s steps(2) infinite; }
.wt-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 2cqmin; }
.w-timer .wbtn { padding: 4px 10px; }
.wt-grp { display: flex; gap: 2cqmin; }
.w-timer .wbtn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
.wt-set { display: flex; align-items: center; gap: 4px; font-size: max(12px, min(4.5cqmin, 17px)); color: #5d6871; }

/* ---------- 小工具的計時器（每個小工具各自計時） ---------- */

      { type: 'clock', x: 61, y: 5, w: 36, h: 30, cfg: { style: 'digital', sec: false, date: true, period: true } },
      { type: 'sched', x: 61, y: 38, w: 36, h: 55 }
    ]
  },
  blank: { name: '空白牆', icon: '⬜', desc: '從空白開始，自己放小工具', bg: 'paper', widgets: [] }
};

/* ---------- 動態牆本體 ---------- */
const Wall = {
  root: null, canvas: null, panel: null, sel: null, live: new Map(), mics: new Map(), tk: null,
  isOpen() { return !!this.root; },
  page() {
    let p = D.wall.pages.find(x => x.id === D.wall.cur);
    if (!p && D.wall.pages.length) { p = D.wall.pages[0]; D.wall.cur = p.id; }
    return p;
  },
  cur() { const p = this.page(); return p && p.widgets.find(w => w.id === this.sel); },
  maxZ() { return Math.max(0, ...this.page().widgets.map(w => w.z || 0)); },
  open() {
    if (!D.wall.pages.length) return this.templates();
    if (this.root) return;
    
    this.root = h('div', { id: 'wall', class: 'wall' });
    document.body.append(this.root); document.body.classList.add('wall-open');
    this.draw();
    this.tk = () => { const now = new Date(); for (const up of this.live.values()) { try { up(now); } catch (e) { console.error(e); } } };
    Tick.add(this.tk);
    this.onKey = e => this.key(e); document.addEventListener('keydown', this.onKey);
    let rt = null; this.onResize = () => { clearTimeout(rt); rt = setTimeout(() => this.root && this.draw(), 200); };
    window.addEventListener('resize', this.onResize);
  },
  close() {
    if (!this.root) return;
    this.stopMics(); Tick.delete(this.tk);
    document.removeEventListener('keydown', this.onKey); window.removeEventListener('resize', this.onResize);
    this.root.remove(); this.root = null; this.sel = null; this.live.clear();
    document.body.classList.remove('wall-open');
    try { localStorage.removeItem('bxbox-wall'); } catch (e) { }
    refresh();
  },
  bgCSS(bg) {
    if (!bg) return WALL_BG.paper.css;
    if (bg.type === 'color') return bg.v;
    if (bg.type === 'image') return '#333';
    return (WALL_BG[bg.v] || WALL_BG.paper).css;
  },
  draw() {
    EmbedKeep.depth++; EmbedKeep.stash(this.root);
    try { this.drawAll(); } finally { EmbedKeep.depth--; EmbedKeep.flush(); }
  },
  drawAll() {
    const P = this.page(), locked = !!D.wall.locked;
    this.stopMics(); this.live.clear();
    this.root.replaceChildren();
    this.root.classList.toggle('locked', locked);
    const cv = this.canvas = h('div', { class: 'w-canvas' });
    cv.style.background = this.bgCSS(P.bg);
    if (P.bg && P.bg.type === 'image') ImgDB.get(P.bg.v).then(u => { if (u) cv.style.background = 'center/cover no-repeat url("' + u + '"), #333'; }).catch(() => { });
    cv.classList.toggle('dark', !!P.bg && (P.bg.v === 'chalk' || P.bg.v === 'night'));
    cv.addEventListener('pointerdown', e => { if (e.target === cv) this.select(null); });
    for (const wd of P.widgets) cv.append(this.makeWidget(wd));
    if (!P.widgets.length) cv.append(h('div', { class: 'w-empty' }, '從下面的工具列加入小工具，拖曳移動、拉右下角調整大小。'));
    const n = D.wall.pages.length, i = D.wall.pages.indexOf(P);
    const nav = h('div', { class: 'w-nav' },
      h('button', { class: 'wbtn', disabled: i <= 0, title: '上一頁', onclick: () => this.go(i - 1) }, '‹'),
      h('button', { class: 'w-pname', title: '頁面選單', onclick: () => this.pageMenu() }, P.name + '　' + (i + 1) + '/' + n),
      h('button', { class: 'wbtn', disabled: i >= n - 1, title: '下一頁', onclick: () => this.go(i + 1) }, '›'),
      h('button', { class: 'wbtn', title: '新增一頁', onclick: () => this.templates() }, '＋'));
    const top = h('div', { class: 'w-top' },
      h('button', { class: 'wbtn', onclick: () => Menu.open() }, '☰ 選單'), Menu.chip(),
      cloudWallLink('wbtn', '☁ 雲端版'),
      h('span', { class: 'grow' }),
      h('button', { class: 'wbtn', title: locked ? '解除鎖定才能移動小工具' : '鎖住後，小工具不會被拖動', onclick: () => { D.wall.locked = !locked; save(); this.sel = null; this.draw(); } }, locked ? '🔓 編輯版面' : '🔒 鎖定版面'),
      h('button', { class: 'wbtn', onclick: () => toggleFull() }, '⛶ 全螢幕'));
    const dock = h('div', { class: 'w-dock' },
      h('button', { class: 'wd-add', onclick: () => this.bgPicker() }, h('span', null, '🎨'), h('small', null, '背景')),
      WT_ORDER.map(k => h('button', { class: 'wd-add', title: '加入' + WT[k].name, onclick: () => this.add(k) }, h('span', null, WT[k].icon), h('small', null, WT[k].name))));
    this.panel = h('div', { class: 'w-panel', hidden: true });
    this.root.append(...[cv, top, locked ? null : dock, nav, this.panel].filter(Boolean));
    if (this.sel && this.cur()) this.select(this.sel, !this.panelWasOpen ? false : true); else this.sel = null;
  },
  makeWidget(wd) {
    const el = h('div', { class: 'wd wd-' + wd.type + (this.sel === wd.id ? ' sel' : ''), 'data-id': wd.id });
    this.place(el, wd);
    const body = h('div', { class: 'wd-body' });
    el.append(body,
      h('div', { class: 'wd-bar' },
        h('button', { title: '設定', onclick: () => this.select(wd.id, true) }, '⚙'),
        h('button', { title: '複製', onclick: () => this.dup(wd) }, '⧉'),
        h('button', { title: '刪除', onclick: () => this.remove(wd) }, '🗑')),
      h('div', { class: 'wd-rs', title: '拖曳調整大小' }));
    this.fill(body, wd);
    el.addEventListener('pointerdown', e => this.down(e, wd, el));
    el.querySelector('.wd-rs').addEventListener('pointerdown', e => this.resize(e, wd, el));
    return el;
  },
  fill(body, wd) {
    EmbedKeep.stash(body);
    body.replaceChildren(); this.live.delete(wd.id);
    const T = WT[wd.type];
    if (T) {
      if (!wd.cfg) wd.cfg = {};
      const def = T.cfg();
      for (const k in def) if (!(k in wd.cfg)) wd.cfg[k] = def[k];
      const up = T.render(body, wd);
      if (up) { this.live.set(wd.id, up); try { up(new Date()); } catch (e) { console.error(e); } }
    }
    if (!EmbedKeep.depth) EmbedKeep.flush();
  },
  drawWidget(wd) {
    const el = this.canvas && this.canvas.querySelector('.wd[data-id="' + wd.id + '"]');
    if (!el) return;
    this.place(el, wd); this.fill(el.querySelector('.wd-body'), wd);
  },
  place(el, wd) { Object.assign(el.style, { left: wd.x + '%', top: wd.y + '%', width: wd.w + '%', height: wd.h + '%', zIndex: wd.z || 1 }); el.classList.toggle('bar-in', wd.y < 8); },
  snap: v => Math.round(v * 2) / 2,
  select(id, openPanel) {
    this.sel = id;
    if (!this.canvas) return;
    $$('.wd', this.canvas).forEach(e => e.classList.toggle('sel', e.dataset.id === id));
    if (!id) { this.panel.hidden = true; this.panelWasOpen = false; return; }
    if (openPanel || !this.panel.hidden) this.showPanel();
  },
  refreshPanel(wd) { if (this.panel && !this.panel.hidden && this.sel === wd.id) this.showPanel(); },
  showPanel() {
    const wd = this.cur(); if (!wd) { this.panel.hidden = true; return; }
    const T = WT[wd.type], p = this.panel;
    const scroll = p.querySelector('.wp-form')?.scrollTop || 0;
    p.hidden = false; this.panelWasOpen = true; p.replaceChildren();
    p.append(h('div', { class: 'wp-head' }, h('b', null, T.icon + ' ' + T.name), h('button', { class: 'x', title: '關閉', onclick: () => { p.hidden = true; this.panelWasOpen = false; } }, '×')));
    const form = h('div', { class: 'wp-form' });
    p.append(form);
    const ap = rebuild => { save(); this.drawWidget(wd); if (rebuild) this.showPanel(); };
    T.settings(form, wd, ap);
    p.append(h('div', { class: 'wp-foot' },
      h('button', { class: 'btn sm', onclick: () => { wd.z = this.maxZ() + 1; save(); this.drawWidget(wd); } }, '⬆ 移到最上層'),
      h('button', { class: 'btn sm', onclick: () => this.dup(wd) }, '⧉ 複製'),
      h('button', { class: 'btn sm danger', onclick: () => this.remove(wd) }, '🗑 刪除')));
    form.scrollTop = scroll;
  },
  down(e, wd, el) {
    if (e.button !== 0 || e.target.closest('.wd-bar, .wd-rs')) return;
    const interactive = e.target.closest('button, input, select, textarea, a, [contenteditable="true"]');
    if (this.sel !== wd.id) this.select(wd.id);
    if (interactive || D.wall.locked) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (er) { }   // 拖過影片／網頁上方時，滑鼠事件才不會被它吃掉
    const r = this.canvas.getBoundingClientRect(), sx = e.clientX, sy = e.clientY, ox = wd.x, oy = wd.y;
    let moved = false;
    const mv = ev => {
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
      if (!moved) { moved = true; wd.z = this.maxZ() + 1; el.style.zIndex = wd.z; el.classList.add('dragging'); }
      wd.x = this.snap(clamp(ox + (ev.clientX - sx) / r.width * 100, 4 - wd.w, 96));
      wd.y = this.snap(clamp(oy + (ev.clientY - sy) / r.height * 100, 0, 96));
      this.place(el, wd);
    };
    const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); el.classList.remove('dragging'); if (moved) save(); };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  },
  resize(e, wd, el) {
    if (D.wall.locked) return;
    e.stopPropagation(); e.preventDefault();
    this.select(wd.id);
    const r = this.canvas.getBoundingClientRect(), sx = e.clientX, sy = e.clientY, ow = wd.w, oh = wd.h;
    el.classList.add('dragging');   // 拉大小時滑鼠經過影片／網頁也收得到
    try { e.target.setPointerCapture(e.pointerId); } catch (er) { }
    const mv = ev => {
      wd.w = this.snap(clamp(ow + (ev.clientX - sx) / r.width * 100, 6, 100 - wd.x));
      wd.h = this.snap(clamp(oh + (ev.clientY - sy) / r.height * 100, 6, 100 - wd.y));
      this.place(el, wd);
    };
    const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); el.classList.remove('dragging'); save(); this.drawWidget(wd); };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  },
  key(e) {
    if (Layers.length) return;
    const t = e.target, typing = t.closest && t.closest('input, textarea, select, [contenteditable="true"]');
    if (typing) return;
    const wd = this.cur();
    if (e.key === 'Escape') { if (wd) this.select(null); return; }
    // 空白鍵：計時器開始／暫停（選了計時器就控制它，否則控制這一頁的第一個計時器；鎖定版面時也可以用）
    if (e.key === ' ') {
      const tw = wd && wd.type === 'timer' ? wd : this.page().widgets.find(w => w.type === 'timer');
      if (!tw) return;
      e.preventDefault(); if (t.closest && t.closest('button')) t.blur();
      wTimer.toggle(tw.cfg); save(); this.drawWidget(tw); return;
    }
    if (!wd || D.wall.locked) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); this.remove(wd); return; }
    const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (mv) { e.preventDefault(); const k = e.shiftKey ? 5 : 0.5; wd.x = clamp(wd.x + mv[0] * k, 4 - wd.w, 96); wd.y = clamp(wd.y + mv[1] * k, 0, 96); this.place(this.canvas.querySelector('.wd[data-id="' + wd.id + '"]'), wd); save(); }
  },
  add(type) {
    const T = WT[type], P = this.page(), n = P.widgets.length;
    const wd = { id: uid(), type, x: this.snap(clamp(50 - T.w / 2 + (n % 5) * 3 - 6, 0, 100 - T.w)), y: this.snap(clamp(42 - T.h / 2 + (n % 5) * 3 - 6, 0, 100 - T.h)), w: T.w, h: T.h, z: this.maxZ() + 1, cfg: T.cfg() };
    P.widgets.push(wd); save();
    this.canvas.querySelector('.w-empty')?.remove();
    this.canvas.append(this.makeWidget(wd));
    this.select(wd.id, true);
    if (type === 'image') this.uploadImg(wd);
  },
  dup(wd) {
    const P = this.page(), c = JSON.parse(JSON.stringify(wd));
    c.id = uid(); c.x = clamp(wd.x + 3, 0, 96); c.y = clamp(wd.y + 3, 0, 96); c.z = this.maxZ() + 1;
    P.widgets.push(c); save(); this.canvas.append(this.makeWidget(c)); this.select(c.id, !this.panel.hidden);
  },
  remove(wd) {
    const P = this.page(), i = P.widgets.indexOf(wd); if (i < 0) return;
    P.widgets.splice(i, 1); this.stopMic(wd.id); this.live.delete(wd.id);
    this.canvas.querySelector('.wd[data-id="' + wd.id + '"]')?.remove();
    if (this.sel === wd.id) this.select(null);
    save();
    toast('已刪除「' + WT[wd.type].name + '」', { undo: () => { P.widgets.splice(i, 0, wd); save(); if (this.root && this.page() === P) this.draw(); } });
  },
  async uploadImg(wd) {
    const f = await pickFile('image/*'); if (!f) return;
    try {
      const url = await readImageFile(f), id = 'img-' + uid();
      await ImgDB.put(id, url); wd.cfg.img = id; save(); this.drawWidget(wd); this.refreshPanel(wd);
    } catch (e) { toast('讀不到這張圖片'); }
  },
  go(i) { const p = D.wall.pages[i]; if (!p) return; D.wall.cur = p.id; this.sel = null; save(); this.draw(); },
  pageMenu() {
    const P = this.page();
    const m = modal('頁面：' + P.name, c => {
      c.body.append(h('label', { class: 'lbl' }, '頁面名稱'), h('input', { class: 'inp', value: P.name, oninput: e => { P.name = e.target.value || '未命名'; save(); } }),
        h('div', { class: 'lbl' }, '全部頁面（點一下切換）'),
        h('div', { class: 'reasons' }, D.wall.pages.map((p, i) => h('button', { class: 'chip' + (p === P ? ' on' : ''), onclick: () => { m.close(); this.go(i); } }, (i + 1) + '. ' + p.name))));
      c.foot.append(
        h('button', { class: 'btn', onclick: () => { const cp = JSON.parse(JSON.stringify(P)); cp.id = uid(); cp.name = P.name + '（複製）'; cp.widgets.forEach(w => { w.id = uid(); }); D.wall.pages.splice(D.wall.pages.indexOf(P) + 1, 0, cp); D.wall.cur = cp.id; save(); m.close(); this.draw(); } }, '複製這一頁'),
        h('button', { class: 'btn danger', onclick: async () => {
          if (!await ask('刪除「' + P.name + '」這一頁？', '刪除', { danger: true })) return;
          const i = D.wall.pages.indexOf(P); D.wall.pages.splice(i, 1);
          m.close();
          if (!D.wall.pages.length) { D.wall.cur = null; save(); this.close(); return; }
          D.wall.cur = D.wall.pages[Math.max(0, i - 1)].id; save(); this.draw();
        } }, '刪除這一頁'),
        h('button', { class: 'btn pri', onclick: () => { m.close(); this.draw(); } }, '完成'));
    });
  },
  templates() {
    const m = modal('新增一面動態牆', c => {
      c.body.append(h('p', { class: 'muted' }, '選一個開始的樣子，之後都可以自由加減、移動小工具。版面會自動記住，下次打開還在。'),
        h('div', { class: 'tpl-grid' }, Object.entries(WALL_TPL).map(([k, t]) => h('button', { class: 'tpl', onclick: () => { m.close(); this.newPage(k); } },
          h('div', { class: 'tpl-prev', style: { background: WALL_BG[t.bg].css } }, t.widgets.map(w => h('i', { style: { left: w.x + '%', top: w.y + '%', width: w.w + '%', height: w.h + '%' } }))),
          h('b', null, t.icon + ' ' + t.name), h('small', { class: 'muted' }, t.desc)))));
    }, { cls: 'wide' });
  },
  newPage(k) {
    const t = WALL_TPL[k];
    const p = { id: uid(), name: t.name, bg: { type: 'preset', v: t.bg }, widgets: t.widgets.map((w, i) => ({ id: uid(), type: w.type, x: w.x, y: w.y, w: w.w, h: w.h, z: i + 1, cfg: Object.assign(WT[w.type].cfg(), JSON.parse(JSON.stringify(w.cfg || {}))) })) };
    D.wall.pages.push(p); D.wall.cur = p.id; D.wall.locked = false; save();
    if (this.root) this.draw(); else this.open();
  },
  bgPicker() {
    const P = this.page();
    const m = modal('背景', c => {
      const set = bg => { P.bg = bg; save(); this.draw(); c.rebuild(); };
      c.body.append(h('div', { class: 'bg-grid' }, Object.entries(WALL_BG).map(([k, b]) => h('button', { class: 'bg-sw' + (P.bg && P.bg.type === 'preset' && P.bg.v === k ? ' on' : ''), style: { background: b.css }, onclick: () => set({ type: 'preset', v: k }) }, h('span', null, b.t)))),
        h('div', { class: 'row wrap' }, '單色：', h('input', { type: 'color', value: P.bg && P.bg.type === 'color' ? P.bg.v : '#f5efe2', onchange: e => set({ type: 'color', v: e.target.value }) }),
          h('button', { class: 'btn', onclick: async () => {
            const f = await pickFile('image/*'); if (!f) return;
            try { const url = await readImageFile(f, 2400), id = 'bg-' + uid(); await ImgDB.put(id, url); set({ type: 'image', v: id }); } catch (e) { toast('讀不到這張圖片'); }
          } }, '🖼 用自己的圖片')));
    });
  },
  stopMic(id) { const M = this.mics.get(id); if (!M) return; cancelAnimationFrame(M.raf); M.stream.getTracks().forEach(t => t.stop()); this.mics.delete(id); },
  stopMics() { for (const id of [...this.mics.keys()]) this.stopMic(id); }
};

function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => toast('這個瀏覽器不能全螢幕，可以按 F11'));
}

</script>
<script>
'use strict';
/* 登入用的 Firebase 設定（班級百寶箱、動態牆單機版、後台共用）。
   在 Firebase 主控台：專案設定 → 一般 → 你的應用程式 → SDK 設定和配置 → 選「設定」，把 firebaseConfig 的內容貼到下面。
   這幾個值是公開的識別碼（本來就會出現在網頁裡），資料安不安全靠的是 Firestore 規則（firebase/firestore.rules）。
   FB_CONFIG 是 null，或直接雙擊 index.html（file://）打開時：不用登入，資料只存在這台電腦的瀏覽器（和以前一樣）。 */
const FB_CONFIG = null;
/* 例如：
const FB_CONFIG = {
  apiKey: '…',
  authDomain: '…',
  projectId: '…',
  storageBucket: '…',
  messagingSenderId: '…',

};

<script>
'use strict';
/* 登入與雲端資料（Firebase）：班級百寶箱、動態牆單機版、後台共用。
   js/cloudcfg.js 的 FB_CONFIG 是 null，或直接雙擊檔案（file://）打開時，什麼都不做：不用登入，資料存在這台電腦的瀏覽器。
   有設定時要先用 Google 帳號登入：
   - 管理者（擁有者和後台加入的管理者）：班級資料存在 Firestore，換電腦登入同一個帳號就是同一份；別台改了，開著的也會跟著變。
   - 觀看者（同事、學生、家長）：只看得到老師開放的動態牆頁面，不能修改；看不到名字和分數。
   Firestore 裡的樣子（規則在 firebase/firestore.rules）：
     config/owner      { email, at }                  擁有者，後台第一次設定時建立，之後不能改
     members/{email}   { role: 'admin'|'viewer', note, at, by }
     d/{key}           { v: JSON 字串, at, by }       班級資料，D 最上層的每個 key 一份
     img/{id}          { url, at }                    圖片（data URL）
     pub/wall          { v: JSON 字串, at }           給觀看者看的動態牆（管理者存檔時順便產生） */

const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const FB_SKIP = ['app', 'v', 'imgs', 'src'];   // 只屬於這個網頁的欄位，不同步
const FB_MAX = 1000000;                        // Firestore 一份文件最多 1 MiB，留一點空間
const FB_ROLE = { owner: '擁有者', admin: '管理者', viewer: '觀看者' };
const fbLower = s => String(s || '').trim().toLowerCase();
const fbBytes = s => new Blob([s]).size;
const fbSleep = ms => new Promise(r => setTimeout(r, ms));
function fbErr(e) {
  const c = (e && e.code) || '';
  return { 'permission-denied': '沒有權限', unavailable: '連不上網路', 'resource-exhausted': '超過今天的免費用量' }[c] || (e && e.message) || String(e);
}
// 圖片太大放不進一份文件時，縮小並轉成 JPEG
async function fbShrink(url, max = 900000) {
  if (!url || url.length <= max) return url;
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  let w = img.naturalWidth, ht = img.naturalHeight, q = 0.85, out = url;
  for (let n = 0; n < 6 && out.length > max; n++) {
    const k = Math.min(1, Math.sqrt(max / out.length) * 0.92);
    w = Math.max(160, Math.round(w * k)); ht = Math.max(120, Math.round(ht * k));
    const c = document.createElement('canvas'); c.width = w; c.height = ht;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, ht); g.drawImage(img, 0, 0, w, ht);
    out = c.toDataURL('image/jpeg', q); q = Math.max(0.6, q - 0.07);
  }
  return out;
}

.wbtn.fb-cls { cursor: default; font-weight: 700; }`));
  },
  show(kind, msg) {
    if (!this.el) { this.el = h('div', { id: 'fbGate' }); document.body.append(this.el); }
    const btn = (t, fn, cls = '') => h('button', { class: 'btn ' + cls, onclick: fn }, t);
    const who = () => h('p', { class: 'fbg-who' }, '目前登入：' + ((FB.auth && FB.auth.currentUser && FB.auth.currentUser.email) || ''));
    const other = () => btn('換一個帳號登入', () => FB.signIn());
    const card = h('div', { class: 'fbg-card' }, h('div', { class: 'fbg-logo' }, FB.fns.icon || '🧰'), h('h1', null, FB.fns.title || document.title));
    if (kind === 'loading') card.append(h('div', { class: 'fbg-spin' }), h('p', { class: 'muted' }, msg || '正在連線…'));
    else if (kind === 'login') card.append(h('p', null, '要先登入才能看。'), btn('🔑 用 Google 帳號登入', () => FB.signIn(), 'pri big'),
      h('p', { class: 'muted small' }, '老師在後台加入的帳號才看得到內容。'));
    else if (kind === 'denied') card.append(who(), h('p', null, '這個帳號還沒有權限。請老師到後台把你的 email 加進來，加好之後重新整理這個網頁。'),
      h('div', { class: 'fbg-btns' }, other(), btn('重新整理', () => location.reload(), 'pri')));
    else if (kind === 'noowner') card.append(who(), h('p', null, '還沒有完成第一次設定：請老師先到後台，把自己的帳號設成擁有者。'),
      h('div', { class: 'fbg-btns' }, other(), h('a', { class: 'btn pri', href: FB.root + 'admin/' }, '🛠 到後台設定')));
    else if (kind === 'empty') card.append(who(), h('p', null, '老師還沒有開放動態牆的頁面，晚一點再來看看。'),
      h('div', { class: 'fbg-btns' }, btn('登出', () => FB.logout())));
    else card.append(h('p', null, msg || '發生錯誤'), btn('重新整理', () => location.reload(), 'pri'));
    card.append(h('p', { class: 'fbg-msg', hidden: true }));
    this.el.replaceChildren(card);
  },
  hide() {
    if (this.el) { this.el.remove(); this.el = null; }
    const v = document.getElementById('veil'); if (v) v.hidden = true;
  },
  msg(t) {
    const m = this.el && this.el.querySelector('.fbg-msg');
    if (m) { m.textContent = t; m.hidden = false; } else toast(t, { ms: 8000 });
  }
};
